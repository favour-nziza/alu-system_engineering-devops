<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Georgia, "Times New Roman", serif; color: #2b2118;
      background: radial-gradient(circle at 50% 40%, #f7efe2 0%, #e8d9bf 100%);
      padding: 24px; text-align: center;
    }
    .frame {
      border: 14px solid #6b4a2b; outline: 3px solid #c9a46b; outline-offset: -22px;
      background: #fbf6ec; padding: 56px 48px; max-width: 560px; width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
    }
    .pipe { font-size: 88px; line-height: 1; margin-bottom: 16px; }
    .code { font-size: 64px; letter-spacing: 8px; color: #6b4a2b; }
    h1 { font-style: italic; font-size: 30px; margin: 12px 0 18px; }
    p { font-size: 17px; line-height: 1.6; color: #5a4a3a; }
    a {
      display: inline-block; margin-top: 28px; padding: 12px 26px; color: #fbf6ec;
      background: #6b4a2b; text-decoration: none; font-family: Arial, sans-serif; border-radius: 4px;
    }
    a:hover { background: #8a6239; }
    .caption { margin-top: 26px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8a7764; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="pipe">&#128684;</div>
    <div class="code">404</div>
    <h1>Ceci n'est pas une page</h1>
    <p>Like Magritte's pipe, what you are looking for is only a representation.<br>
       The page you requested does not exist, or it has wandered off the canvas.</p>
    <a href="/">Back to the gallery</a>
    <div class="caption">La trahison des URLs</div>
  </div>
</body>
</html>
